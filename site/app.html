<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Paramutuel full dApp: create wagers, bet, resolve, and claim (embedded self-custody UI)." />
  <title>Paramutuel - App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="iframe-page iframe-page--with-embed-hint">
  <nav>
    <span class="logo">Paramutuel</span>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="index.html#place-a-bet">Place a bet</a>
      <a href="bet.html">Bet page</a>
      <a href="explorer.html">Explorer</a>
      <a href="app.html" class="active">App</a>
      <a href="about.html">About</a>
    </div>
  </nav>
  <div id="networkBannerSlot"></div>
  <script src="network-banner.js" defer></script>
  <p class="muted app-embed-share-hint" id="appEmbedShareHint"></p>
  <iframe src="dapp/index.html" title="Paramutuel dApp" allow="clipboard-write"></iframe>
  <script>
    (function () {
      const el = document.getElementById("appEmbedShareHint");
      if (!el) return;
      const betBase = new URL("bet.html", window.location.href).href.split(/[?#]/)[0];
      el.appendChild(document.createTextNode("After you create a wager, share "));
      const code = document.createElement("code");
      code.textContent = `${betBase}?wager=WAGER_ADDRESS`;
      el.appendChild(code);
      el.appendChild(
        document.createTextNode(" — replace WAGER_ADDRESS with the wager contract address shown in the app.")
      );
    })();
  </script>
  <footer class="app-shell-footer">
    <a href="about.html">About</a>
    · <a href="https://github.com/autarkenterprises/paramutuel" class="external">GitHub</a>
  </footer>
</body>
</html>
