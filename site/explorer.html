<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Paramutuel wager explorer: browse indexer-backed markets and open the bet flow." />
  <title>Paramutuel - Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="iframe-page">
  <script src="network-context.js"></script>
  <nav>
    <span class="logo">Paramutuel</span>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="propose-a-wager.html">Propose a Wager</a>
      <a href="place-a-bet.html">Place a Bet</a>
      <a href="bet.html">Bet page</a>
      <a href="explorer.html" class="active">Explorer</a>
      <a href="app.html">App</a>
      <a href="about.html">About</a>
    </div>
  </nav>
  <div id="networkBannerSlot"></div>
  <script src="network-banner.js" defer></script>
  <div class="iframe-config">
    <label for="indexerUrl">Indexer API URL:</label>
    <input id="indexerUrl" type="text" placeholder="http://127.0.0.1:8090" />
    <button id="loadExplorer">Connect</button>
    <span id="indexerHint" class="muted"></span>
  </div>
  <iframe id="explorerFrame" src="explorer/index.html" title="Paramutuel Explorer"></iframe>
  <script>
    const configUrl = "config/deployments.json";

    function setExplorerFrameFromInput() {
      const url = document.getElementById("indexerUrl").value.trim();
      const frame = document.getElementById("explorerFrame");
      frame.src = url ? "explorer/index.html?api=" + encodeURIComponent(url) : "explorer/index.html";
    }

    const PSN = window.ParamutuelSiteNetwork;
    const hintEl = document.getElementById("indexerHint");
    if (hintEl) {
      hintEl.textContent = PSN
        ? PSN.copy.explorerLeaveBlank
        : "Leave blank to use this site’s default market API.";
    }

    async function applyDefaultIndexerFromConfig() {
      try {
        const response = await fetch(configUrl);
        if (!response.ok) return;
        const data = await response.json();
        const netKey = PSN ? PSN.getActiveNetworkKey(data) : String(data?.defaultNetwork || "baseSepolia").trim();
        const apiBase = String(data?.[netKey]?.explorerApiBase || "").trim();
        const input = document.getElementById("indexerUrl");
        const hint = document.getElementById("indexerHint");
        if (!apiBase) return;
        input.value = apiBase;
        if (hint && PSN) hint.textContent = PSN.copy.explorerIndexerDefault;
      } catch (_) {
        // Keep manual-only mode if config is unavailable.
      }
    }

    document.getElementById("loadExplorer").addEventListener("click", setExplorerFrameFromInput);

    applyDefaultIndexerFromConfig().finally(setExplorerFrameFromInput);

    if (PSN) {
      window.addEventListener(PSN.EVENT, (ev) => {
        const cfg = ev.detail && ev.detail.config;
        const nk = ev.detail && ev.detail.networkKey;
        if (!cfg || !nk) return;
        const apiBase = String(cfg[nk]?.explorerApiBase || "").trim();
        const input = document.getElementById("indexerUrl");
        const hint = document.getElementById("indexerHint");
        if (apiBase) {
          input.value = apiBase;
          if (hint) hint.textContent = PSN.copy.explorerIndexerAfterToggle;
        } else {
          input.value = "";
          if (hint) hint.textContent = PSN.copy.explorerIndexerMissing;
        }
        setExplorerFrameFromInput();
      });
    }
  </script>
  <footer class="app-shell-footer">
    <a href="about.html">About</a>
    · <a href="https://github.com/autarkenterprises/paramutuel" class="external">GitHub</a>
  </footer>
</body>
</html>
