[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paramutuel-mcp"
version = "0.1.0"
description = "MCP server for the Paramutuel on-chain parimutuel betting protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Autark Enterprises" },
]
keywords = [
    "mcp",
    "paramutuel",
    "betting",
    "blockchain",
    "base",
    "ethereum",
    "prediction-wager",
    "llm",
    "ai-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # 2.x removed mcp.server.fastmcp, which server.py imports. Unbounded, a fresh install failed at import.
    "mcp>=1.0.0,<2",
    "httpx>=0.25.0",
    "eth-abi>=5.0.0",
    "eth-hash[pycryptodome]",
]

[project.urls]
Homepage = "https://github.com/autarkenterprises/paramutuel"
Repository = "https://github.com/autarkenterprises/paramutuel"
Documentation = "https://github.com/autarkenterprises/paramutuel/blob/master/docs/MACHINE.md"
"Bug Tracker" = "https://github.com/autarkenterprises/paramutuel/issues"

[project.scripts]
paramutuel-mcp = "mcp_server.server:mcp_server.run"

# This file sits inside the package directory, so the project root is the package itself. Paths here
# are relative to it. The factory address and indexer URL come from a bundled copy of the deployments
# config, so an installed server does not default to localhost with no factory.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "mcp_server/__init__.py"
"__main__.py" = "mcp_server/__main__.py"
"server.py" = "mcp_server/server.py"
"abi" = "mcp_server/abi"
"../config/deployments.json" = "mcp_server/deployments.json"
