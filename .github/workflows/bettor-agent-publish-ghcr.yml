# Build and push scout container to GitHub Container Registry.
# Tag format: bettor-agent-v0.2.0  ->  ghcr.io/<owner>/paramutuel-bettor-agent:0.2.0 and :latest
name: Publish bet scout agent (GHCR)

on:
  push:
    tags:
      - "bettor-agent-v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner (GHCR)
        id: own
        run: echo "lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Parse version
        id: ver
        run: echo "value=${GITHUB_REF_NAME#bettor-agent-v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/betting-agents/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.own.outputs.lower }}/paramutuel-bettor-agent:${{ steps.ver.outputs.value }}
            ghcr.io/${{ steps.own.outputs.lower }}/paramutuel-bettor-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
