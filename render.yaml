services:
  - type: web
    name: paramutuel-indexer
    runtime: python
    plan: free
    buildCommand: "true"
    startCommand: PYTHONPATH=. python3 -m service.indexer.live_api --host 0.0.0.0 --port $PORT
    envVars:
      - key: RPC_URL_BASE_SEPOLIA
        sync: false
      - key: FACTORY_ADDRESS
        sync: false
      - key: INDEXER_NETWORK
        value: base-sepolia
      - key: INDEXER_POLL_INTERVAL_SECONDS
        value: "15"
      - key: INDEXER_DB_PATH
        value: /var/data/indexer.db
    disk:
      name: indexer-data
      mountPath: /var/data
      sizeGB: 1
