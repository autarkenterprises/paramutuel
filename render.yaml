services:
  - type: web
    name: paramutuel-indexer
    runtime: python
    plan: free
    buildCommand: "true"
    startCommand: PYTHONPATH=. python3 -m service.indexer.live_api --host 0.0.0.0 --port $PORT --network base-sepolia --deployments-config-path config/deployments.json
    envVars:
      - key: RPC_URL_BASE_SEPOLIA
        value: https://sepolia.base.org
      - key: INDEXER_NETWORK
        value: base-sepolia
      - key: INDEXER_POLL_INTERVAL_SECONDS
        value: "15"
      - key: INDEXER_FROM_BLOCK
        value: "39608044"
      - key: INDEXER_CHUNK_SIZE
        value: "120"
      - key: INDEXER_DB_PATH
        value: /tmp/indexer.db
