<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Paramutuel Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Paramutuel Explorer</h1>
      <p class="muted">Reads wager state from the indexer API.</p>
      <div class="meta">
        <div><strong>Configured factory:</strong> <code id="factoryAddressDisplay">from deployments.json (if available)</code></div>
        <div><strong>API base:</strong> <code id="apiBaseDisplay">default</code></div>
      </div>
      <div class="controls">
        <input id="marketSearch" placeholder="Search by proposition, outcome text, or wager address" />
        <select id="marketOrder">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
        <button id="searchBtn">Search</button>
        <button id="refresh">Refresh</button>
        <button id="loadMore">Load More</button>
      </div>
      <details class="field-controls">
        <summary>Field visibility and details</summary>
        <div class="field-controls-inner">
          <div class="field-actions">
            <button id="fieldsCore" type="button">Core fields</button>
            <button id="fieldsAll" type="button">All fields</button>
          </div>
          <div id="fieldPicker" class="field-picker"></div>
          <label class="field-toggle">
            <input type="checkbox" id="includeRowDetails" checked />
            Show collapsible full-field details per wager row
          </label>
        </div>
      </details>
      <div id="resultMeta" class="muted"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr id="marketHeader"></tr>
          </thead>
          <tbody id="markets"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
