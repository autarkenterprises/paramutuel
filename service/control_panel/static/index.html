<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Paramutuel Control Panel</title>
</head>
<body>
  <h1>Paramutuel Control Panel</h1>
  <p>Builds operator commands for wager lifecycle actions.</p>

  <section>
    <h2>Preview wager action command</h2>
    <label>Wager <input id="wager" placeholder="0x..." /></label>
    <label>Action
      <select id="action">
        <option value="close-betting">close-betting</option>
        <option value="close-resolution-window">close-resolution-window</option>
        <option value="resolve">resolve</option>
        <option value="retract">retract</option>
        <option value="expire">expire</option>
      </select>
    </label>
    <label>Protocol
      <select id="protocolVersion">
        <option value="enumerated">enumerated</option>
        <option value="freeform">freeform</option>
      </select>
    </label>
    <label>Winning ticket bitmask (enumerated resolve) <input id="outcomeIndex" type="number" /></label>
    <label>Winning answer UTF-8 (freeform resolve only) <input id="winningAnswer" placeholder="exact string" /></label>
    <button id="preview">Preview</button>
    <pre id="out"></pre>
  </section>
  <script src="/app.js"></script>
</body>
</html>
